# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_6                         # unique; used in DB, logs, secret names
    tiktok_username: "ehfuni"             # no @  -- funny/cute baby moments compilation. 778.9K followers / 35.3M likes. Run by the same small operator as @babyluxi (contact ehmixe@gmail.com) but @babyluxi has a confusing large-view YouTube channel under a near-identical name; @ehfuni checked clean on YouTube (only 0/1-subscriber dead channels) -> picked this one. Swapped in from "Grime and Shine" (pressure-washing) at user's request -- wanted baby/family content instead.
    youtube_channel_name: "Baby Chuckles"
    owner_email: "dineshdineshdhaker1@gmail.com"

    google_credentials_file: "credentials/channel_6_client_secret.json"
    oauth_token_file: "tokens/channel_6_token.json"

    videos_per_day: 2
    description_footer: ""
    default_tags: [funny baby, cute baby, baby laughing, baby moments, funny kids,
                   cute baby videos, baby giggles, adorable baby, baby reaction,
                   toddler funny, funny baby videos, cutest baby, baby humor,
                   wholesome, family, baby compilation, so cute, baby fails, cute kids]
    youtube_category_id: "23"             # 23 Comedy (funny baby moments)
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    min_video_seconds: 12                 # skip clips shorter than 12s
    max_video_seconds: 175                # keep it in Shorts range
    upload_mode: popular_only             # always pick the most-viewed unposted video
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 3.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.06
      contrast: 1.04
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      hook_caption:                    # burned-in hook, first 3s (retention + transformation)
        enabled: true
        seconds: 3
        position: top
        size_pct: 5.6
      brand_overlay:                     # small corner mark = the channel's own logo
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 10
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [255, 196, 92]
      hook_templates:
        - "SO CUTE"
        - "WAIT FOR IT"
        - "MELT YOUR HEART"
        - "TOO FUNNY"

    slot_publish_times_utc:               # these ARE the cron fire times
      1: "16:00"                          # 12:00 PM US Eastern (US midday scroll) = 9:30 PM IST
      2: "14:30"                          # 8:00 PM IST
