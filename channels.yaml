# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_6                         # unique; used in DB, logs, secret names
    tiktok_username: "leepinkclean"       # no @  -- pressure-washing / overgrown outdoor-space transformations ("giving neglected spaces a second chance", often free for people in need). 47.9K followers / 909K likes, wholesome + oddly-satisfying before/after, pure TikTok-native (no YouTube channel). Swapped in from the dead "Trench Unknown" ocean source @deepoceanusa (0 subs / 33 views after 11 vids, source exhausted). Ocean niche abandoned - the dedicated faceless sources are all tiny/private/AI-slop.
    youtube_channel_name: "Grime and Shine"
    owner_email: "dineshdineshdhaker1@gmail.com"

    google_credentials_file: "credentials/channel_6_client_secret.json"
    oauth_token_file: "tokens/channel_6_token.json"

    videos_per_day: 2
    description_footer: ""
    default_tags: [pressure washing, power washing, satisfying, oddly satisfying, before and after,
                   transformation, deep clean, driveway cleaning, patio cleaning, cleanup,
                   satisfying cleaning, overgrown, garden makeover, restoration, soft washing,
                   asmr cleaning, cleaning satisfying, so satisfying, satisfying video, curb appeal]
    youtube_category_id: "24"             # 24 Entertainment (oddly-satisfying / broad reach)
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    min_video_seconds: 12                 # skip clips shorter than 12s
    max_video_seconds: 175                # keep it in Shorts range
    upload_mode: popular_only             # always pick the most-viewed unposted video
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 3.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.06
      contrast: 1.05
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      hook_caption:                    # burned-in hook, first 3s (retention + transformation)
        enabled: true
        seconds: 3
        position: top
        size_pct: 5.6
      brand_overlay:                     # small corner mark = the channel's own logo
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 10
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [46, 204, 150]
      hook_templates:
        - "THE TRANSFORMATION"
        - "10 YEARS OF GRIME"
        - "SO SATISFYING"
        - "BEFORE vs AFTER"

    slot_publish_times_utc:               # these ARE the cron fire times
      1: "16:00"                          # 12:00 PM US Eastern (US midday scroll) = 9:30 PM IST
      2: "14:30"                          # 8:00 PM IST
